<!DOCTYPE html>
<html>
<head>
    <title>Physics Bouncy Simulation with Drawing Tool</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; }
        canvas {
            display: block;
            background: #f0f0f0;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1;
        }
        button {
            margin: 5px;
        }
        input[type="range"] {
            margin: 5px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <button id="addCube">Add Cube</button>
        <button id="addCircle">Add Circle</button>
        <button id="addTriangle">Add Triangle</button>
        <button id="addCloth">Add Cloth</button>
        <button id="addBouncyCube">Add Bouncy Cube</button>
        <button id="addBouncyCircle">Add Bouncy Circle</button>
        <button id="addBouncyTriangle">Add Bouncy Triangle</button>
        <button id="addBouncyCloth">Add Bouncy Cloth</button>
        <button id="addWalls">Add Walls</button>
        <button id="scaleDown">Scale Down Shapes</button>
        <button id="enableDraw">Enable Drawing Mode</button> <!-- New button for enabling drawing -->
        <button id="disableDraw">Disable Drawing Mode</button> <!-- New button for disabling drawing -->
        <button id="enableDelete">Enable Delete Mode</button> <!-- New button for enabling delete mode -->
        <button id="disableDelete">Disable Delete Mode</button> <!-- New button for disabling delete mode -->
        <button id="addTNT">Add TNT Block</button> <!-- New button for adding TNT block -->
        <button id="addDelayedTNT">Add Delayed TNT Block</button> <!-- New button for adding delayed TNT block -->
        <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1">
        <label for="zoomSlider">Zoom Level</label>
        <button id="add1000Circles">Add 1000 Circles</button>
    
    </div>
    <canvas id="world"></canvas>
    <!-- Include Matter.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
        // Alias Matter.js modules
        const { Engine, Render, Runner, World, Bodies, Mouse, MouseConstraint, Body, Constraint, Composite } = Matter;

        // Create an engine
        const engine = Engine.create();
        const { world } = engine;

        // Create a renderer
        const canvas = document.getElementById('world');
        const render = Render.create({
            canvas: canvas,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: '#f0f0f0',
            },
        });

        Render.run(render);

        // Create runner
        const runner = Runner.create();
        Runner.run(runner, engine);

        // Drawing variables
        let isDrawing = false;
        let drawPath = [];

        // Function to start drawing
        function startDrawing(event) {
            isDrawing = true;
            drawPath = []; // Reset the path
            const mousePos = getMousePos(event);
            drawPath.push(mousePos);
        }

        // Function to draw on the canvas
        function draw(event) {
            if (!isDrawing) return;
            const mousePos = getMousePos(event);
            drawPath.push(mousePos);
            const context = canvas.getContext('2d');
            context.lineWidth = 2;
            context.strokeStyle = 'black';
            context.lineJoin = 'round';
            context.beginPath();
            context.moveTo(drawPath[drawPath.length - 2].x, drawPath[drawPath.length - 2].y);
            context.lineTo(mousePos.x, mousePos.y);
            context.stroke();
        }

        // Function to stop drawing and create a static shape
        function stopDrawing() {
            isDrawing = false;
            if (drawPath.length > 0) {
                const vertices = drawPath.map(point => {
                    return { x: point.x, y: point.y };
                });
                const shape = Bodies.fromVertices(drawPath[0].x, drawPath[0].y, vertices, { isStatic: true });
                World.add(world, shape);
            }
            clearCanvas(); // Clear the canvas after creating the shape
        }

        // Function to get mouse position
        function getMousePos(event) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: event.clientX - rect.left,
                y: event.clientY - rect.top
            };
        }

        // Function to clear the canvas
        function clearCanvas() {
            const context = canvas.getContext('2d');
            context.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Function to enable drawing mode
        function enableDrawing() {
            clearCanvas(); // Clear the canvas when entering draw mode
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
        }

        // Function to disable drawing mode
        function disableDrawing() {
            canvas.removeEventListener('mousedown', startDrawing);
            canvas.removeEventListener('mousemove', draw);
            canvas.removeEventListener('mouseup', stopDrawing);
        }

        // Function to add walls around the screen
        function addWalls() {
            const wallThickness = 20; // Thickness of the walls

            // Create walls
            const topWall = Bodies.rectangle(window.innerWidth / 2, 0, window.innerWidth, wallThickness, { isStatic: true });
            const bottomWall = Bodies.rectangle(window.innerWidth / 2, window.innerHeight, window.innerWidth, wallThickness, { isStatic: true });
            const leftWall = Bodies.rectangle(0, window.innerHeight / 2, wallThickness, window.innerHeight, { isStatic: true });
            const rightWall = Bodies.rectangle(window.innerWidth, window.innerHeight / 2, wallThickness, window.innerHeight, { isStatic: true });

            // Add walls to the world
            World.add(world, [topWall, bottomWall, leftWall, rightWall]);
        }

        // Function to scale down all shapes by 50%
        function scaleDownShapes() {
            const bodies = Composite.allBodies(world); // Get all bodies in the world
            bodies.forEach(body => {
                if (!body.isStatic) { // Only scale non-static bodies
                    const scaleFactor = 0.5;
                    // Scale the body
                    Body.scale(body, scaleFactor, scaleFactor);
                }
            });
        }

        // Function to add a cube
        function addCube() {
            const cube = Bodies.rectangle(window.innerWidth / 2, window.innerHeight / 2, 60, 60, {
                restitution: 0.5,
                friction: 0.5,
                render: {
                    fillStyle: '#FF6347',
                },
            });
            World.add(world, cube);
        }

        // Function to create a bouncy cube
        function addBouncyCube() {
            const bouncyCube = Bodies.rectangle(window.innerWidth / 2, window.innerHeight / 2, 60, 60, {
                restitution: 1.2,
                friction: 0.1,
                render: {
                    fillStyle: '#FF6347',
                },
            });
            World.add(world, bouncyCube);
        }

        // Function to add a circle
        function addCircle() {
            const circle = Bodies.circle(window.innerWidth / 2, window.innerHeight / 2, 30, {
                restitution: 0.5,
                friction: 0.5,
                render: {
                    fillStyle: '#4682B4',
                },
            });
            World.add(world, circle);
        }

        // Function to create a bouncy circle
        function addBouncyCircle() {
            const bouncyCircle = Bodies.circle(window.innerWidth / 2, window.innerHeight / 2, 30, {
                restitution: 1.2,
                friction: 0.1,
                render: {
                    fillStyle: '#4682B4',
                },
            });
            World.add(world, bouncyCircle);
        }

        // Function to add a triangle
        function addTriangle() {
            const triangle = Bodies.polygon(window.innerWidth / 2, window.innerHeight / 2, 3, 30, {
                restitution: 0.5,
                friction: 0.5,
                render: {
                    fillStyle: '#FFD700',
                },
            });
            World.add(world, triangle);
        }

        // Function to create a bouncy triangle
        function addBouncyTriangle() {
            const bouncyTriangle = Bodies.polygon(window.innerWidth / 2, window.innerHeight / 2, 3, 30, {
                restitution: 1.2,
                friction: 0.1,
                render: {
                    fillStyle: '#FFD700',
                },
            });
            World.add(world, bouncyTriangle);
        }

        // Function to create a cloth
        let cloth = [];
        function addCloth() {
            cloth = [];
            const clothWidth = 5; // Number of columns
            const clothHeight = 5; // Number of rows
            const spacing = 40; // Spacing between bodies

            // Create a grid of bodies
            for (let y = 0; y < clothHeight; y++) {
                for (let x = 0; x < clothWidth; x++) {
                    const body = Bodies.rectangle(x * spacing + 200, y * spacing + 100, 20, 20, {
                        restitution: 0.5,
                        friction: 0.5,
                    });
                    cloth.push(body);
                    World.add(world, body);
                }
            }

            // Create constraints between the bodies to simulate cloth
            for (let y = 0; y < clothHeight; y++) {
                for (let x = 0; x < clothWidth; x++) {
                    if (x < clothWidth - 1) {
                        const constraint = Constraint.create({
                            bodyA: cloth[y * clothWidth + x],
                            bodyB: cloth[y * clothWidth + (x + 1)],
                            stiffness: 0.2,
                        });
                        World.add(world, constraint);
                    }
                    if (y < clothHeight - 1) {
                        const constraint = Constraint.create({
                            bodyA: cloth[y * clothWidth + x],
                            bodyB: cloth[(y + 1) * clothWidth + x],
                            stiffness: 0.2,
                        });
                        World.add(world, constraint);
                    }
                }
            }
        }

        // Function to create a bouncy cloth
        function addBouncyCloth() {
            const bouncyCloth = [];
            const clothWidth = 5; // Number of columns
            const clothHeight = 5; // Number of rows
            const spacing = 40; // Spacing between bodies

            // Create a grid of bodies
            for (let y = 0; y < clothHeight; y++) {
                for (let x = 0; x < clothWidth; x++) {
                    const body = Bodies.rectangle(x * spacing + 200, y * spacing + 100, 20, 20, {
                        restitution: 1.2,
                        friction: 0.1,
                    });
                    bouncyCloth.push(body);
                    World.add(world, body);
                }
            }

            // Create constraints between the bodies to simulate bouncy cloth
            for (let y = 0; y < clothHeight; y++) {
                for (let x = 0; x < clothWidth; x++) {
                    if (x < clothWidth - 1) {
                        const constraint = Constraint.create({
                            bodyA: bouncyCloth[y * clothWidth + x],
                            bodyB: bouncyCloth[y * clothWidth + (x + 1)],
                            stiffness: 0.2,
                        });
                        World.add(world, constraint);
                    }
                    if (y < clothHeight - 1) {
                        const constraint = Constraint.create({
                            bodyA: bouncyCloth[y * clothWidth + x],
                            bodyB: bouncyCloth[(y + 1) * clothWidth + x],
                            stiffness: 0.2,
                        });
                        World.add(world, constraint);
                    }
                }
            }
        }

        // Function to handle zooming based on slider value
        function handleZoom() {
            const zoomLevel = document.getElementById('zoomSlider').value;
            const newWidth = window.innerWidth * zoomLevel; // Adjust width based on zoom level
            const newHeight = window.innerHeight * zoomLevel; // Adjust height based on zoom level
            
            // Update the canvas size
            render.canvas.width = newWidth;
            render.canvas.height = newHeight;
            render.options.width = newWidth;
            render.options.height = newHeight;

            Render.setPixelRatio(render, window.devicePixelRatio);
        }

        // Function to add 1000 circles gradually
        function add1000Circles() {
            let count = 0;
            const totalCircles = 1000;
            const interval = setInterval(() => {
                if (count < totalCircles) {
                    addBouncyCircle(); // Add a bouncy circle
                    count++;
                } else {
                    clearInterval(interval); // Stop adding circles when done
                }
            }, 50); // Add a circle every 50 milliseconds
        }

        // Add a static floor
        const floor = Bodies.rectangle(window.innerWidth / 2, window.innerHeight - 20, window.innerWidth, 40, {
            isStatic: true,
            render: {
                fillStyle: '#8B4513',
            },
        });
        World.add(world, floor);

        // Add mouse control
        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: {
                stiffness: 0.2,
                render: { visible: false },
            },
        });

        World.add(world, mouseConstraint);
        render.mouse = mouse;

        // Delete mode variable
        let isDeleteMode = false;

        // Function to enable delete mode
        function enableDelete() {
            isDeleteMode = true; // Set delete mode to true
            canvas.addEventListener('click', deleteBody); // Add click event listener for deleting bodies
        }

        // Function to disable delete mode
        function disableDelete() {
            isDeleteMode = false; // Set delete mode to false
            canvas.removeEventListener('click', deleteBody); // Remove click event listener
        }

        // Function to delete a body on click
        function deleteBody(event) {
            if (!isDeleteMode) return; // Only delete if in delete mode
            const mousePos = getMousePos(event);
            const bodies = Composite.allBodies(world); // Get all bodies in the world

            // Check if any body is clicked
            bodies.forEach(body => {
                if (Matter.Bounds.contains(body.bounds, mousePos)) {
                    World.remove(world, body); // Remove the body from the world
                }
            });
        }

        // Add event listeners for delete mode buttons
        document.getElementById('enableDelete').addEventListener('click', enableDelete);
        document.getElementById('disableDelete').addEventListener('click', disableDelete);

        // Add event listeners for buttons and slider
        document.getElementById('addCube').addEventListener('click', addCube);
        document.getElementById('addCircle').addEventListener('click', addCircle);
        document.getElementById('addTriangle').addEventListener('click', addTriangle);
        document.getElementById('addCloth').addEventListener('click', addCloth);
        document.getElementById('addBouncyCube').addEventListener('click', addBouncyCube);
        document.getElementById('addBouncyCircle').addEventListener('click', addBouncyCircle);
        document.getElementById('addBouncyTriangle').addEventListener('click', addBouncyTriangle);
        document.getElementById('addBouncyCloth').addEventListener('click', addBouncyCloth);
        document.getElementById('addWalls').addEventListener('click', addWalls); // Event listener for adding walls
        document.getElementById('scaleDown').addEventListener('click', scaleDownShapes); // Event listener for scaling down shapes
        document.getElementById('enableDraw').addEventListener('click', enableDrawing); // Event listener for enabling drawing
        document.getElementById('disableDraw').addEventListener('click', disableDrawing); // Event listener for disabling drawing
        document.getElementById('zoomSlider').addEventListener('input', handleZoom);
        document.getElementById('add1000Circles').addEventListener('click', add1000Circles);

        // Handle window resize
        function resize() {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
            render.options.width = window.innerWidth;
            render.options.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        // Render loop
        (function renderLoop() {
            requestAnimationFrame(renderLoop);
            Render.world(render);
        })();

        // Function to handle TNT explosion
        function explodeTNT(tntBlock) {
            // Remove TNT block
            World.remove(world, tntBlock); 

            // Shake effect
            shakeScreen();

            // Apply knockback force to nearby bodies
            const bodies = Composite.allBodies(world); // Get all bodies in the world
            const explosionRadius = 100; // Define the radius for the explosion effect
            const forceMagnitude = 0.1; // Increased force magnitude for stronger knockback

            bodies.forEach(body => {
                // Check if the body is within the explosion radius
                const distance = Matter.Vector.magnitude(Matter.Vector.sub(body.position, tntBlock.position));
                if (body !== tntBlock && distance < explosionRadius) {
                    // Calculate direction and apply force
                    const direction = Matter.Vector.normalise(Matter.Vector.sub(body.position, tntBlock.position));
                    Body.applyForce(body, body.position, Matter.Vector.mult(direction, forceMagnitude * body.mass)); // Apply stronger force based on mass
                }
            });

            // Create explosion effect
            createExplosionEffect(tntBlock.position);

            // Create smoke particles
            createSmokeParticles(tntBlock.position);

            // Check for nearby TNT blocks to trigger chain reaction
            triggerChainReaction(tntBlock.position);
        }

        // Function to trigger chain reaction
        function triggerChainReaction(position) {
            const explosionRadius = 100; // Define the radius for chain reaction
            const bodies = Composite.allBodies(world); // Get all bodies in the world

            bodies.forEach(body => {
                if (body.label === 'TNT' && body.position) {
                    const distance = Matter.Vector.magnitude(Matter.Vector.sub(body.position, position));
                    if (distance < explosionRadius) {
                        // Trigger explosion for nearby TNT blocks
                        explodeTNT(body);
                    }
                }
            });
        }

        // Function to add a delayed TNT block
        function addDelayedTNT() {
            const delayedTNT = Bodies.rectangle(window.innerWidth / 2, window.innerHeight / 2, 40, 40, {
                restitution: 0.5,
                friction: 0.5,
                render: {
                    fillStyle: '#00FF00', // Green color for delayed TNT
                    strokeStyle: '#FF0000', // Red stripe
                    lineWidth: 5,
                },
                label: 'Delayed TNT', // Label for identification
            });
            World.add(world, delayedTNT);

            // Set a timeout to explode after 5 seconds
            setTimeout(() => {
                explodeTNT(delayedTNT);
            }, 5000); // 5000 milliseconds = 5 seconds
        }

        // Function to add a regular TNT block
        function addTNT() {
            const tntBlock = Bodies.rectangle(window.innerWidth / 2, window.innerHeight / 2, 40, 40, {
                restitution: 0.5,
                friction: 0.5,
                render: {
                    fillStyle: '#FF0000', // Red color for TNT
                },
                label: 'TNT', // Label for identification
            });
            World.add(world, tntBlock);
            tntBlock.clickCount = 0; // Initialize click count
            tntBlock.lastClickTime = 0; // Initialize last click time

            // Add click event listener for TNT block
            canvas.addEventListener('click', function(event) {
                const mousePos = getMousePos(event);
                if (Matter.Bounds.contains(tntBlock.bounds, mousePos)) {
                    const currentTime = Date.now();
                    // Check if the click is within 1 second
                    if (currentTime - tntBlock.lastClickTime <= 1000) {
                        tntBlock.clickCount++;
                    } else {
                        tntBlock.clickCount = 1; // Reset count if more than 1 second has passed
                    }
                    tntBlock.lastClickTime = currentTime;

                    // Check if clicked 5 times
                    if (tntBlock.clickCount >= 5) {
                        explodeTNT(tntBlock); // Call explode function
                    }
                }
            });
        }

        // Function to create explosion effect
        function createExplosionEffect(position) {
            const explosionCount = 20; // Number of explosion particles
            for (let i = 0; i < explosionCount; i++) {
                const explosionParticle = Bodies.circle(position.x, position.y, 15, { // Size of explosion particles
                    restitution: 0.5,
                    friction: 0.1,
                    render: {
                        fillStyle: 'rgba(255, 165, 0, 0.8)', // Orange color for explosion
                    },
                });
                World.add(world, explosionParticle);

                // Apply an outward force to the explosion particle
                const angle = Math.random() * Math.PI * 2; // Random angle for explosion direction
                const forceMagnitude = 0.1; // Force magnitude for explosion particles
                const outwardForce = { x: Math.cos(angle) * forceMagnitude, y: Math.sin(angle) * forceMagnitude };
                Body.applyForce(explosionParticle, explosionParticle.position, outwardForce);

                // Set a timeout to remove the explosion particle after a short duration
                setTimeout(() => {
                    // Gradually reduce opacity before removal
                    let opacity = 0.8; // Initial opacity
                    const fadeOutInterval = setInterval(() => {
                        opacity -= 0.05; // Decrease opacity
                        if (opacity <= 0) {
                            clearInterval(fadeOutInterval);
                            World.remove(world, explosionParticle); // Remove particle when fully faded
                        } else {
                            explosionParticle.render.fillStyle = `rgba(255, 165, 0, ${opacity})`; // Update particle color with new opacity
                        }
                    }, 100); // Fade out interval
                }, 500); // Start fading after 500 milliseconds
            }
        }

        // Function to create smoke particles
        function createSmokeParticles(position) {
            const smokeCount = 20; // Increased number of smoke particles
            for (let i = 0; i < smokeCount; i++) {
                const smokeParticle = Bodies.circle(position.x, position.y, 10, { // Increased size of smoke particles
                    restitution: 0.5,
                    friction: 0.1,
                    render: {
                        fillStyle: 'rgba(169, 169, 169, 0.7)', // Gray color for smoke
                    },
                });
                World.add(world, smokeParticle);

                // Apply an upward force to the smoke particle with some random horizontal movement
                const upwardForce = { x: (Math.random() - 0.5) * 0.02, y: -0.05 - Math.random() * 0.02 }; // Random horizontal and upward force
                Body.applyForce(smokeParticle, smokeParticle.position, upwardForce);

                // Set a timeout to remove the smoke particle after a short duration
                setTimeout(() => {
                    // Gradually reduce opacity before removal
                    let opacity = 0.7; // Initial opacity
                    const fadeOutInterval = setInterval(() => {
                        opacity -= 0.05; // Decrease opacity
                        if (opacity <= 0) {
                            clearInterval(fadeOutInterval);
                            World.remove(world, smokeParticle); // Remove particle when fully faded
                        } else {
                            smokeParticle.render.fillStyle = `rgba(169, 169, 169, ${opacity})`; // Update particle color with new opacity
                        }
                    }, 100); // Fade out interval
                }, 2000); // Start fading after 2 seconds
            }
        }

        // Function to shake the screen
        function shakeScreen() {
            const originalPosition = { x: render.canvas.style.transform.x || 0, y: render.canvas.style.transform.y || 0 };
            let shakeDuration = 500; // Duration of shake in milliseconds
            let shakeInterval = 50; // Interval between shakes
            let shakeAmount = 10; // Amount of shake

            const shake = setInterval(() => {
                const xOffset = (Math.random() * shakeAmount) - (shakeAmount / 2);
                const yOffset = (Math.random() * shakeAmount) - (shakeAmount / 2);
                render.canvas.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
            }, shakeInterval);

            setTimeout(() => {
                clearInterval(shake);
                render.canvas.style.transform = `translate(${originalPosition.x}px, ${originalPosition.y}px)`; // Reset position
            }, shakeDuration);
        }

        // Add event listener for delayed TNT block button
        document.getElementById('addDelayedTNT').addEventListener('click', addDelayedTNT);

        // Add event listener for regular TNT block button
        document.getElementById('addTNT').addEventListener('click', addTNT);
    </script>
</body>
</html>
